<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>{{ plugin_name | e }} {{ version | e }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
  <style>
      body {
          word-break: break-word;
          line-height: 1.75;
          font-weight: 400;
          font-size: 32px;
          margin: 0;
          padding: 0;
          overflow-x: hidden;
          color: #2c3e50;
          font-family: -apple-system, BlinkMacSystemFont, Segoe UI, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
      }

      /* 顶部横幅 */
      .hero {
          background: linear-gradient(135deg, #3276dc 0%, #4fa3ff 55%, #8ed0ff 100%);
          color: #fff;
          padding: 30px 40px 26px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          box-shadow: 0 4px 18px rgba(50, 118, 220, 0.35);
      }
      .hero .brand {
          font-size: 48px;
          font-weight: 800;
          letter-spacing: 1px;
          text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }
      .hero .brand::before {
          content: "⚡";
          margin-right: 12px;
      }
      .hero .ver {
          font-size: 30px;
          font-weight: 700;
          background: rgba(255, 255, 255, 0.22);
          border: 1px solid rgba(255, 255, 255, 0.45);
          border-radius: 999px;
          padding: 6px 22px;
          letter-spacing: 1px;
      }

      /* 内容区 */
      #content {
          min-width: 200px;
          max-width: 88%;
          margin: 0 auto;
          padding: 44px 24px 40px;
      }

      h1, h2, h3, h4, h5, h6 {
          line-height: 1.45;
          margin-top: 34px;
          margin-bottom: 12px;
          color: #1a3a63;
      }
      h1:first-child, h2:first-child, h3:first-child, h4:first-child, h5:first-child, h6:first-child {
          margin-top: 0;
          margin-bottom: 1rem;
      }
      h1 {
          position: relative;
          font-size: 42px;
          padding-bottom: 14px;
          border-bottom: 3px solid rgba(50, 118, 220, 0.35);
      }
      h1::before {
          content: "▎";
          color: #3276dc;
          margin-right: 6px;
      }
      h2 {
          font-size: 36px;
          padding-bottom: 10px;
          border-bottom: 2px solid #eef2f8;
      }
      h2::before {
          content: "● ";
          color: #4fa3ff;
      }
      h3 {
          font-size: 30px;
      }
      h3::before {
          content: "▪ ";
          color: #4fa3ff;
      }
      h4, h5, h6 {
          font-size: 26px;
      }

      p {
          line-height: inherit;
          margin-top: 18px;
          margin-bottom: 18px;
      }
      strong {
          color: #1a3a63;
          font-weight: 700;
      }
      em {
          color: #3276dc;
      }
      img {
          max-width: 100%;
          border-radius: 10px;
          display: block;
          margin: auto;
          border: 3px solid rgba(79, 163, 255, 0.25);
      }
      hr {
          border: none;
          border-top: 2px dashed #c6d6ee;
          margin-top: 34px;
          margin-bottom: 34px;
      }
      code {
          font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
          word-break: break-word;
          padding: 0.18rem 0.5rem;
          color: #c0392b;
          font-size: 0.85em;
          background-color: #fdf2f2;
          border-radius: 6px;
      }
      pre {
          font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
          overflow: auto;
          position: relative;
          line-height: 1.65;
          border-radius: 12px;
          border: none;
          background: #f6f9fd;
          box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.06);
          padding: 18px 16px;
      }
      pre > code {
          font-size: 12px;
          padding: 0;
          margin: 0;
          word-break: normal;
          display: block;
          color: #2c3e50;
          background: transparent;
      }
      pre.shiki {
          padding: 18px 16px;
      }
      pre.shiki > code {
          padding: 0;
          background: transparent !important;
          color: inherit;
          font-size: 12px;
      }
      a {
          font-weight: 600;
          text-decoration: none;
          color: #3276dc;
          word-break: break-all;
      }
      a:hover, a:active {
          text-decoration: underline;
      }
      table {
          width: 100%;
          font-size: 13px;
          border-collapse: separate;
          border-spacing: 0;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 2px 10px rgba(50, 118, 220, 0.12);
          margin: 20px 0;
      }
      thead {
          background: linear-gradient(135deg, #3276dc, #4fa3ff);
          color: #fff;
          text-align: left;
      }
      thead th {
          padding: 14px 12px;
          font-weight: 700;
      }
      tr:nth-child(2n) {
          background-color: #f2f7ff;
      }
      td {
          padding: 12px 12px;
          line-height: 1.6;
          border-bottom: 1px solid #eef2f8;
      }
      th {
          padding: 12px;
          border-bottom: none;
      }
      blockquote {
          color: #4a648c;
          padding: 16px 22px;
          margin: 24px 0;
          border-left: 6px solid #4fa3ff;
          background: linear-gradient(90deg, #eef5ff 0%, #f8fbff 100%);
          border-radius: 0 10px 10px 0;
      }
      blockquote p {
          margin: 8px 0;
      }
      details {
          border: none;
          outline: none;
          border-left: 4px solid #4fa3ff;
          padding-left: 14px;
          margin-left: 4px;
      }
      details summary {
          cursor: pointer;
          font-weight: 600;
          color: #1a3a63;
      }
      ol, ul {
          padding-left: 30px;
      }
      ol li, ul li {
          margin-bottom: 8px;
          line-height: 1.7;
      }
      ul li {
          list-style: none;
      }
      ul li:before {
          content: "◆";
          margin-right: 10px;
          color: #4fa3ff;
          font-size: 0.7em;
          vertical-align: middle;
      }
      ol li::marker {
          color: #3276dc;
          font-weight: 700;
      }
  </style>
</head>
<body>
  <div class="hero">
    <span class="brand">{{ plugin_name | e }}</span>
    <span class="ver">{{ version | e }}</span>
  </div>
  <article id="content"></article>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <textarea id="markdown-source" hidden>{{ text | e }}</textarea>
  <script>
    (function () {
      const contentElement = document.getElementById("content");
      const source = document.getElementById("markdown-source").value;

      contentElement.innerHTML = marked.parse(source);

      if (window.AstrBotT2IShiki) {
        window.AstrBotT2IShiki.highlightAllCodeBlocks(contentElement, "github-light");
      }

      if (window.renderMathInElement) {
        window.renderMathInElement(contentElement, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }

    })();
  </script>
</body>
</html>
